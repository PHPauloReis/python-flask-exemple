<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Produto</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-8">
    <div class="max-w-2xl mx-auto px-4">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">Editar Produto</h1>
            <p class="text-gray-600">Atualize as informações do produto</p>
        </div>

        <!-- Form Container -->
        <div class="bg-white rounded-lg shadow-lg p-8">
            <form id="editForm">
                <!-- Nome -->
                <div class="mb-6">
                    <label for="nome" class="block text-sm font-semibold text-gray-700 mb-2">
                        Nome do Produto
                    </label>
                    <input 
                        type="text" 
                        id="nome" 
                        name="nome" 
                        value="{{ produto.nome }}"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Digite o nome do produto"
                    >
                </div>

                <!-- Preço -->
                <div class="mb-6">
                    <label for="preco" class="block text-sm font-semibold text-gray-700 mb-2">
                        Preço (R$)
                    </label>
                    <input 
                        type="number" 
                        id="preco" 
                        name="preco" 
                        value="{{ produto.preco }}"
                        required
                        step="0.01"
                        min="0"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Digite o preço"
                    >
                </div>

                <!-- Categoria -->
                <div class="mb-8">
                    <label for="categoria" class="block text-sm font-semibold text-gray-700 mb-2">
                        Categoria
                    </label>
                    <select 
                        id="categoria" 
                        name="categoria"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                        <option value="">Selecione uma categoria</option>
                        <option value="Eletrônicos" {% if produto.categoria == 'Eletrônicos' %}selected{% endif %}>Eletrônicos</option>
                        <option value="Periféricos" {% if produto.categoria == 'Periféricos' %}selected{% endif %}>Periféricos</option>
                        <option value="Monitores" {% if produto.categoria == 'Monitores' %}selected{% endif %}>Monitores</option>
                        <option value="Outros" {% if produto.categoria == 'Outros' %}selected{% endif %}>Outros</option>
                    </select>
                </div>

                <!-- Buttons -->
                <div class="flex gap-4">
                    <button 
                        type="submit"
                        id="submitBtn"
                        class="flex-1 bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors"
                    >
                        Salvar Alterações
                    </button>
                    <a 
                        href="/produtos"
                        class="flex-1 bg-gray-400 text-white px-6 py-3 rounded-lg font-semibold hover:bg-gray-500 transition-colors text-center"
                    >
                        Cancelar
                    </a>
                </div>

                <!-- Status Message -->
                <div id="statusMessage" class="mt-6 hidden p-4 rounded-lg"></div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const produto_id = "{{ produto._id }}";
            const nome = document.getElementById('nome').value;
            const preco = parseFloat(document.getElementById('preco').value);
            const categoria = document.getElementById('categoria').value;

            try {
                const response = await fetch(`/api/produtos/${produto_id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nome: nome,
                        preco: preco,
                        categoria: categoria
                    })
                });

                const statusDiv = document.getElementById('statusMessage');

                if (response.ok) {
                    const data = await response.json();
                    statusDiv.innerHTML = '<p class="text-green-700 font-semibold">✅ ' + data.mensagem + '</p>';
                    statusDiv.className = 'mt-6 p-4 rounded-lg bg-green-100 border border-green-300';
                    
                    setTimeout(() => {
                        window.location.href = '/produtos';
                    }, 1500);
                } else {
                    const error = await response.json();
                    statusDiv.innerHTML = '<p class="text-red-700 font-semibold">❌ Erro: ' + error.erro + '</p>';
                    statusDiv.className = 'mt-6 p-4 rounded-lg bg-red-100 border border-red-300';
                }
                
                statusDiv.classList.remove('hidden');
            } catch (error) {
                const statusDiv = document.getElementById('statusMessage');
                statusDiv.innerHTML = '<p class="text-red-700 font-semibold">❌ Erro ao enviar: ' + error.message + '</p>';
                statusDiv.className = 'mt-6 p-4 rounded-lg bg-red-100 border border-red-300';
                statusDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
